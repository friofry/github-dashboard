# Source of truth for GitHubDashboard.xcodeproj. Regenerate with `xcodegen` after editing.
name: GitHubDashboard
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  DashboardCore:
    path: Core
targets:
  GitHubDashboard:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
      # The pr-review skill ships inside the app so reviews always use the matching version.
      - path: skills
        type: folder
        buildPhase: resources
    dependencies:
      - package: DashboardCore
        product: DashboardCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: GitHub Dashboard
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMultipleInstancesProhibited: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        DashboardOrgs: $(DASHBOARD_ORGS)
        DashboardIgnoredLogins: $(DASHBOARD_IGNORED_LOGINS)
    settings:
      base:
        PRODUCT_NAME: GitHub Dashboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(DASHBOARD_BUNDLE_ID)
        # Overridden from .env by the run scripts.
        DASHBOARD_BUNDLE_ID: dev.example.github-dashboard
        DASHBOARD_ORGS: ""
        DASHBOARD_IGNORED_LOGINS: ""
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
